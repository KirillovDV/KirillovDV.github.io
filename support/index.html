<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Напишите Денису Кириллову через форму обратной связи.">
  <title>Обратная связь — Денис Кириллов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Static/support.css">
</head>
<body class="support-page">
  <div id="particles-js" aria-hidden="true"></div>
  <main class="support-card">
    <a class="support-back" href="../">← На главную</a>
    <h1>Обратная связь</h1>
    <p class="support-intro">Напишите мне — отвечу на указанную электронную почту.</p>

    <form class="support-form" data-support-form novalidate>
      <div class="form-field">
        <label for="name">Ваше имя</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
        <span class="field-error" data-error-for="name" aria-live="polite"></span>
      </div>

      <div class="form-field">
        <label for="email">Электронная почта</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <span class="field-error" data-error-for="email" aria-live="polite"></span>
      </div>

      <div class="form-field">
        <label for="social">Ссылка на профиль в соцсети</label>
        <input id="social" name="social" type="url" inputmode="url" placeholder="https://t.me/ваш_ник" maxlength="500" required>
        <span class="field-error" data-error-for="social" aria-live="polite"></span>
      </div>

      <div class="form-field">
        <label for="message">Сообщение</label>
        <textarea id="message" name="message" maxlength="5000" required></textarea>
        <span class="field-error" data-error-for="message" aria-live="polite"></span>
      </div>

      <label class="honeypot" aria-hidden="true" for="website">Оставьте это поле пустым</label>
      <input class="honeypot" id="website" name="_honey" type="text" tabindex="-1" autocomplete="off">

      <button class="submit-button" type="submit">Отправить сообщение</button>
      <p class="form-status" data-form-status aria-live="polite"></p>
      <p class="privacy-note">Отправляя форму, вы соглашаетесь на использование этих данных только для ответа на ваше обращение.</p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="../Static/script.js"></script>
  <script type="module" src="../Static/support-form.mjs"></script>
</body>
</html>
